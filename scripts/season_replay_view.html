<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Season replay 2026</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{--bg:#f4f1ea;--panel:#fffdf8;--ink:#1d2a24;--muted:#5d6b64;--line:#ddd6c8;--accent:#176b56;
  --att:#d9481e;--watch:#e8a317;--none:#3f9b6c;--un:#9aa19d;--c25:#7a8580}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,"Segoe UI",sans-serif}
#app{display:grid;grid-template-columns:minmax(0,1fr) 420px;grid-template-rows:auto auto minmax(0,1fr);height:100%}
#banner{grid-column:1/3;background:#21332b;color:#f3efe4;padding:8px 16px;font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#banner b{font-weight:650}
#banner .sp{flex:1}
#lang button{background:none;border:1px solid #6f8579;color:#f3efe4;border-radius:6px;padding:2px 8px;cursor:pointer;font:inherit}
#lang button.on{background:#f3efe4;color:#21332b}
#controls{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
#controls button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 11px;cursor:pointer;min-width:40px}
#controls button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
#slider{flex:1;min-width:0;accent-color:var(--accent)}
#wklabel{font-weight:650;white-space:nowrap;min-width:150px;text-align:right}
#map{min-height:0}
#side{overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding:14px 16px 24px}
h2{font-size:17px;margin:0 0 6px}
h3{font-size:14px;margin:16px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.notes{margin:0;padding-left:18px}.notes li{margin:3px 0}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;margin-top:8px}
.big{font-size:22px;font-weight:700}.muted{color:var(--muted);font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:13px;margin-top:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;border-bottom:1px solid var(--line);padding:4px 3px}
td{padding:5px 3px;border-bottom:1px solid #eee7da;vertical-align:middle}
tr.c{cursor:pointer}tr.c:hover,tr.c.sel{background:#f1ede2}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.up{color:var(--att)}.down{color:var(--none)}
.mk{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--att);color:var(--att);font-weight:800;
  display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
svg.chart{width:100%;height:120px;display:block}
.fine{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.4}
.maplibregl-popup-content{color:#1d2a24;font:13px/1.35 system-ui,"Segoe UI",sans-serif}
#detail .close{float:right;border:none;background:none;font-size:18px;cursor:pointer;color:var(--muted)}
@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 46vh auto;height:auto}
  #banner,#controls{grid-column:1}
  #map{height:46vh}
  #side{border-left:none;border-top:1px solid var(--line)}
  #wklabel{min-width:0;font-size:13px;flex-basis:100%;text-align:left;order:5}
  #controls{gap:6px;padding:8px 12px;flex-wrap:wrap}
  #controls button{padding:5px 8px;min-width:34px}
}
</style>
</head>
<body>
<div id="app">
  <div id="banner"><b data-t="title"></b><span data-t="banner"></span><span class="sp"></span>
    <span id="lang"><button data-l="hy">ՀԱՅ</button> <button data-l="en">EN</button></span></div>
  <div id="controls">
    <button id="prev" aria-label="previous week">◀</button>
    <button id="play" class="primary" aria-label="play">▶</button>
    <button id="next" aria-label="next week">▶|</button>
    <input id="slider" type="range" min="0" max="0" value="0" aria-label="week">
    <span id="wklabel"></span>
  </div>
  <div id="map"></div>
  <div id="side">
    <h2 id="wkhead"></h2>
    <ul class="notes" id="notes"></ul>
    <div class="legend" id="legend"></div>
    <div id="detail"></div>
    <h3 data-t="area"></h3>
    <div class="card" id="areacard"></div>
    <h3 data-t="communities"></h3>
    <table><thead><tr><th data-t="community"></th><th class="num" data-t="score"></th><th class="num" data-t="vs25"></th><th class="num" data-t="cover"></th></tr></thead>
      <tbody id="tbody"></tbody></table>
    <div class="fine" data-t="fine"></div>
  </div>
</div>
<script>
const T = {
 hy: {title:"Սեզոնի վերարտադրություն 2026", banner:"Նախնական զննում՝ ոչ ջրառի գրառումներ, ոչ հրահանգներ։ Ամեն շաբաթ օգտագործվում են միայն մինչև այդ շաբաթը հասանելի տվյալները։",
  area:"Ամբողջ ուսումնասիրվող տարածքը", communities:"Համայնքներ", community:"Համայնք", score:"Ցուցանիշ", vs25:"2025-ի համեմատ", cover:"Գնահատված",
  week:"Շաբաթ", lv:{attention:"Առաջին հերթին ուշադրություն", watch:"Հետևել", none:"Հատուկ նշան չկա", unassessed:"Չգնահատված"}, outside:"Ուսումնասիրությունից դուրս",
  need:"Մշակաբույսերի ջրի գնահատված պահանջ այս շաբաթ (զուտ, տեղումները հանած)", th:"հազ. մ³", same25:"2025-ի նույն շաբաթ", range:"2021–2025 միջակայք",
  chart:"Ջրի պահանջ ըստ շաբաթների՝ 2026 (կանաչ) և 2025 (մոխրագույն)", scored:"գնահատված", guarded:"բերքահավաք/հնձից հետո", bare:"բաց հող", noview:"առանց պարզ պատկերի",
  dry:"Չորության հնարավոր նշաններով", parcels:"հողամաս", ndvi:"Կանաչության տարբերություն 2025-ի համեմատ", ndmi:"Խոնավության տարբերություն 2025-ի համեմատ", pairs:"համեմատված հողամաս",
  schart:"Համայնքի ցուցանիշը ըստ շաբաթների՝ 2026 (կանաչ) և 2025 (մոխրագույն)",
  fine:"Մեթոդ. արբանյակային կանաչություն և խոնավություն (Sentinel-2) + եղանակ (ERA5)։ Ցուցանիշ = 100 × փուլ × (0.5 պահանջ + 0.3 չորություն + 0.2 եղանակ), համայնքի մակերեսով կշռված միջնարժեք։ Բերքահավաքը և հունձը սթրես չեն համարվում։ Ջրի պահանջը լրիվ մշակաբույսային պահանջ է՝ ±25%, առանց ոռոգման արդյունավետության։ Հողատեսքերը (v1.4) կազմվել են 2026-ի վերջին՝ սա հայտնի ստատիկ քարտեզի սահմանափակում է։ Շաբաթական նշումները գրված են ֆիքսված կանոններով, ոչ արհեստական բանականության մոդելով։ Հայերեն տեքստը պետք է ստուգի մայրենի խոսող։"},
 en: {title:"Season replay 2026", banner:"Draft screening — not delivery records, not orders. Each week uses only data available by the end of that week.",
  area:"Whole study area", communities:"Communities", community:"Community", score:"Score", vs25:"vs 2025", cover:"Scored",
  week:"Week", lv:{attention:"Look here first", watch:"Watch", none:"No special sign", unassessed:"Unassessed"}, outside:"Outside the study parcels",
  need:"Estimated crop water need this week (net of rain)", th:"thousand m³", same25:"same week of 2025", range:"2021–2025 range",
  chart:"Water need by week: 2026 (green) and 2025 (grey)", scored:"scored", guarded:"after harvest/cut", bare:"bare soil", noview:"no clear view",
  dry:"With possible dryness signs", parcels:"parcels", ndvi:"Greenness difference vs 2025", ndmi:"Moisture difference vs 2025", pairs:"parcels compared",
  schart:"Community score by week: 2026 (green) and 2025 (grey)",
  fine:"Method: satellite greenness and moisture (Sentinel-2) + weather (ERA5). Score = 100 × stage × (0.5 demand + 0.3 dryness + 0.2 weather), area-weighted median per community. Harvests and cuts are not read as stress. Water need is the full crop requirement, ±25%, before irrigation losses. Land types (v1.4) were made in late 2026: a known static-map limitation. Weekly notes are written by fixed rules, not by an AI model."}
};
const COL = {attention:"#d9481e", watch:"#e8a317", none:"#3f9b6c", unassessed:"#9aa19d"};
let L = (()=>{try{return localStorage.getItem("replayLang")||"hy"}catch(e){return "hy"}})();
let META, WEEKS = [], idx = 0, cur = null, sel = null, timer = null, markers = [];
const $ = s => document.querySelector(s);
const fmt = (v, d=0) => v==null ? "–" : Number(v).toLocaleString("en-US", {maximumFractionDigits:d, minimumFractionDigits:d});
const thou = v => v==null ? "–" : fmt(v/1000, v < 1e5 ? 1 : 0);
const sgn = v => v==null ? "–" : (v > 0 ? "+" : "") + fmt(v, 0);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MON = {hy:["հունվ","փետր","մարտ","ապր","մայիս","հունիս","հուլիս","օգոստ","սեպտ","հոկտ","նոյ","դեկ"], en:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]};
const dshort = s => { const d = new Date(s + "T00:00"); return d.getDate() + " " + MON[L][d.getMonth()]; };

function applyLang(){
  document.documentElement.lang = L;
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = T[L][e.dataset.t]);
  document.querySelectorAll("#lang button").forEach(b => b.classList.toggle("on", b.dataset.l === L));
  $("#legend").innerHTML = ["attention","watch","none","unassessed"].map(k => `<span><span class="sw" style="background:${COL[k]}"></span>${T[L].lv[k]}</span>`).join("")
    + `<span><span class="sw" style="background:none;border:1.5px solid #fff;outline:1px solid #888"></span>${T[L].outside}</span>`;
  if (cur) render();
}
document.querySelectorAll("#lang button").forEach(b => b.onclick = () => { L = b.dataset.l; try{localStorage.setItem("replayLang", L)}catch(e){} applyLang(); });

const map = new maplibregl.Map({container:"map", center:[44.28, 40.15], zoom:10.6, maxZoom:16, attributionControl:{compact:true},
  style:{version:8, sources:{sat:{type:"raster", tileSize:256, maxzoom:19, attribution:"Imagery © Esri, Maxar, Earthstar Geographics",
    tiles:["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"]}},
    layers:[{id:"sat", type:"raster", source:"sat"}]}});
map.addControl(new maplibregl.NavigationControl({showCompass:false}), "top-right");
let GEO, CENTER = {};

function centroid(geom){
  const ring = geom.type === "Polygon" ? geom.coordinates[0] : geom.coordinates.reduce((a, p) => p[0].length > a.length ? p[0] : a, []);
  let x = 0, y = 0; ring.forEach(p => { x += p[0]; y += p[1]; }); return [x / ring.length, y / ring.length];
}

function paintMap(){
  if (!GEO || !map.getSource("comm")) return;
  const by = Object.fromEntries(cur.rows.map(r => [r.community, r]));
  GEO.features.forEach(f => { const r = by[f.properties.name]; f.properties.level = r ? r.level : "out"; f.properties.sel = f.properties.name === sel; });
  map.getSource("comm").setData(GEO);
  markers.forEach(m => m.remove()); markers = [];
  cur.markers.forEach((name, i) => {
    if (!CENTER[name]) return;
    const el = document.createElement("div"); el.className = "mk"; el.textContent = i + 1; el.title = name;
    el.onclick = () => selectCommunity(name);
    markers.push(new maplibregl.Marker({element:el}).setLngLat(CENTER[name]).addTo(map));
  });
}

function spark(series, keyA, keyB, maxv){
  const W = 360, H = 110, P = 6, wk0 = WEEKS[0].week, wk1 = WEEKS[WEEKS.length - 1].week;
  const all = [...(series[keyA]||[]), ...(series[keyB]||[])].map(p => p[1]).filter(v => v != null);
  const mx = maxv || Math.max(1, ...all);
  const xy = p => [P + (W - 2*P) * (p[0] - wk0) / (wk1 - wk0), H - P - (H - 2*P) * (p[1] || 0) / mx];
  const line = (pts, c, w) => pts && pts.length ? `<polyline fill="none" stroke="${c}" stroke-width="${w}" points="${pts.filter(p => p[1] != null).map(p => xy(p).join(",")).join(" ")}"/>` : "";
  const lab = [[14,"Apr"],[23,"Jun"],[31,"Aug"],[40,"Oct"]].map(([w]) => { const x = P + (W-2*P)*(w-wk0)/(wk1-wk0); return `<line x1="${x}" x2="${x}" y1="${P}" y2="${H-P}" stroke="#eee7da"/>`; }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${lab}${line(series[keyB], "#9aa19d", 1.6)}${line(series[keyA], "#176b56", 2.4)}</svg>`;
}

function render(){
  const w = WEEKS[idx];
  $("#wklabel").textContent = `${T[L].week} ${w.week} · ${dshort(w.week_start)}–${dshort(w.week_end)}`;
  $("#wkhead").textContent = `${T[L].week} ${w.week}: ${dshort(w.week_start)} – ${dshort(w.week_end)} ${META.year}`;
  $("#notes").innerHTML = cur.notes[L].map(s => `<li>${esc(s)}</li>`).join("");
  const a = cur.rows.find(r => r.community === "ALL"), b = cur.rows_2025.find(r => r.community === "ALL");
  const d = b && b.net_m3 ? 100 * (a.net_m3 - b.net_m3) / b.net_m3 : null;
  const rng = cur.range_net_m3;
  $("#areacard").innerHTML = `<div class="muted">${T[L].need}</div>
    <div class="big">${thou(a.net_m3 * 0.75)}–${thou(a.net_m3 * 1.25)} <span class="muted">${T[L].th}</span></div>
    <div class="muted">${T[L].same25}: ${b ? thou(b.net_m3) : "–"} (${sgn(d)}%) · ${T[L].range}: ${rng ? thou(rng[0]) + "–" + thou(rng[1]) : "–"}</div>
    <div class="muted" style="margin-top:6px">${T[L].chart}</div>${spark(cur.net_series, "2026", "2025")}
    <div class="muted">${T[L].scored} ${fmt(100*a.scored_share)}% · ${T[L].guarded} ${fmt(100*a.guarded_share)}% · ${T[L].bare} ${fmt(100*a.bare_share)}% · ${T[L].noview} ${fmt(100*a.no_view_share)}%</div>`;
  const prev = Object.fromEntries(cur.rows_2025.map(r => [r.community, r]));
  const rank = {attention:3, watch:2, none:1, unassessed:0};
  const list = cur.rows.filter(r => r.community !== "ALL" && !r.community.startsWith("(")).sort((x, y) => rank[y.level] - rank[x.level] || (y.score||0) - (x.score||0));
  $("#tbody").innerHTML = list.map(r => {
    const p = prev[r.community], ds = p && r.score != null && p.score != null ? r.score - p.score : null;
    const mi = cur.markers.indexOf(r.community);
    return `<tr class="c${r.community === sel ? " sel" : ""}" data-n="${esc(r.community)}"><td><span class="dot" style="background:${COL[r.level]}"></span>${mi >= 0 ? "<b>" + (mi+1) + ".</b> " : ""}${esc(r.community)}</td>
      <td class="num">${r.score == null ? "–" : fmt(r.score)}</td><td class="num ${ds > 0 ? "up" : ds < 0 ? "down" : ""}">${sgn(ds)}</td><td class="num">${fmt(100*r.scored_share)}%</td></tr>`;
  }).join("");
  document.querySelectorAll("tr.c").forEach(tr => tr.onclick = () => selectCommunity(tr.dataset.n));
  renderDetail();
  paintMap();
}

function renderDetail(){
  const r = sel && cur.rows.find(x => x.community === sel);
  if (!r) { $("#detail").innerHTML = ""; return; }
  const p = cur.rows_2025.find(x => x.community === sel);
  const dn = p && p.net_m3 ? 100 * (r.net_m3 - p.net_m3) / p.net_m3 : null;
  $("#detail").innerHTML = `<div class="card"><button class="close" aria-label="close">×</button>
    <b>${esc(sel)}</b> — <span style="color:${COL[r.level]};font-weight:650">${T[L].lv[r.level]}</span>
    <div class="muted">${T[L].score}: ${r.score == null ? "–" : fmt(r.score)} (${T[L].same25}: ${p && p.score != null ? fmt(p.score) : "–"}) · ${fmt(r.area_ha)} ha</div>
    <div class="muted">${T[L].need}: ${thou(r.net_m3)} ${T[L].th} (${sgn(dn)}% vs 2025)</div>
    <div class="muted">${T[L].dry}: ${r.dry_parcels} ${T[L].parcels} (${fmt(r.dry_ha, 1)} ha)</div>
    <div class="muted">${T[L].ndvi}: ${r.ndvi_diff == null ? "–" : fmt(r.ndvi_diff, 2)} · ${T[L].ndmi}: ${r.ndmi_diff == null ? "–" : fmt(r.ndmi_diff, 2)} (${r.pairs || 0} ${T[L].pairs})</div>
    <div class="muted">${T[L].scored} ${fmt(100*r.scored_share)}% · ${T[L].guarded} ${fmt(100*r.guarded_share)}% · ${T[L].bare} ${fmt(100*r.bare_share)}% · ${T[L].noview} ${fmt(100*r.no_view_share)}%</div>
    <div class="muted" style="margin-top:6px">${T[L].schart}</div>${spark(cur.series[sel] || {}, "2026", "2025", 100)}</div>`;
  $("#detail .close").onclick = () => { sel = null; render(); };
}

function selectCommunity(name){ sel = name; render(); $("#side").scrollTop = 0; }

async function go(i){
  idx = Math.max(0, Math.min(WEEKS.length - 1, i));
  $("#slider").value = idx;
  const r = await fetch(`/api/week/${WEEKS[idx].week}`);
  cur = await r.json();
  render();
}
function stop(){ clearInterval(timer); timer = null; $("#play").textContent = "▶"; }
$("#play").onclick = () => {
  if (timer) return stop();
  if (idx >= WEEKS.length - 1) go(0);
  $("#play").textContent = "❚❚";
  timer = setInterval(() => { if (idx >= WEEKS.length - 1) return stop(); go(idx + 1); }, 2200);
};
$("#prev").onclick = () => { stop(); go(idx - 1); };
$("#next").onclick = () => { stop(); go(idx + 1); };
$("#slider").oninput = e => { stop(); go(+e.target.value); };

(async () => {
  META = await (await fetch("/api/meta")).json();
  WEEKS = META.weeks;
  $("#slider").max = WEEKS.length - 1;
  applyLang();
  GEO = await (await fetch("/data/communities.geojson")).json();
  GEO.features.forEach(f => CENTER[f.properties.name] = centroid(f.geometry));
  const ready = () => {
    if (map.getSource("comm")) return;
    map.addSource("comm", {type:"geojson", data:GEO});
    map.addLayer({id:"comm-fill", type:"fill", source:"comm", paint:{"fill-color":["match", ["get","level"], "attention", COL.attention, "watch", COL.watch,
      "none", COL.none, "unassessed", COL.unassessed, "rgba(0,0,0,0)"], "fill-opacity":["case", ["==", ["get","level"], "out"], 0, 0.5]}});
    map.addLayer({id:"comm-line", type:"line", source:"comm", paint:{"line-color":"#ffffff", "line-width":["case", ["get","sel"], 3.5, 1.2],
      "line-opacity":["case", ["==", ["get","level"], "out"], 0.55, 0.95]}});
    map.on("click", "comm-fill", e => { const f = e.features[0]; if (f.properties.level !== "out") selectCommunity(f.properties.name); });
    const tip = new maplibregl.Popup({closeButton:false, closeOnClick:false, offset:8});
    map.on("mousemove", "comm-fill", e => { map.getCanvas().style.cursor = "pointer"; const f = e.features[0];
      tip.setLngLat(e.lngLat).setHTML(`<b>${esc(f.properties.name)}</b>` + (f.properties.level === "out" ? `<br><small>${T[L].outside}</small>` : `<br><small>${T[L].lv[f.properties.level]}</small>`)).addTo(map); });
    map.on("mouseleave", "comm-fill", () => { map.getCanvas().style.cursor = ""; tip.remove(); });
    const b = new maplibregl.LngLatBounds();
    GEO.features.filter(f => f.properties.in_study).forEach(f => (f.geometry.type === "Polygon" ? [f.geometry.coordinates] : f.geometry.coordinates)
      .forEach(poly => poly[0].forEach(c => b.extend(c))));
    if (!b.isEmpty()) map.fitBounds(b, {padding:20, duration:0});
    if (cur) paintMap();
  };
  const iv = setInterval(() => { if (map.isStyleLoaded()) { clearInterval(iv); ready(); } }, 150);
  const start = WEEKS.findIndex(w => w.week === 14);
  go(start >= 0 ? start : 0);
})();
</script>
